name: Deploy auf GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests & Build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Code holen
        uses: actions/checkout@v5

      - name: Node einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Typprüfung
        run: npm run typecheck

      - name: Tests (Rechenkern, Datenschicht, Katalog)
        run: npm test

      - name: Pages konfigurieren
        id: pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Statischen Export bauen
        run: npm run build
        env:
          # z. B. "/PointPilot" – leer, wenn eine eigene Domain genutzt wird
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Artefakt hochladen
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Veröffentlichen
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
